# ==============================================================================
# 4. BUNKER PROXY CONFIGURATION
# ==============================================================================
bunker:
  # ASSUMPTION: Brent crude is quoted in USD per barrel (bbl).
  # Marine Very Low Sulphur Fuel Oil (VLSFO) is traded in USD per metric ton (MT).
  # 1 metric ton of crude oil ≈ 7.33 barrels.
  # Historical refining crack spread for VLSFO over crude typically ranges from 1.05 to 1.25.
  # Effective factor = 7.33 * 1.15 ≈ 8.43 USD/MT per USD/bbl of Brent.
  # verify: calibrated against Singapore VLSFO spot benchmark vs ICE Brent.
  brent_to_vlsfo_factor: 8.5     # verify: multiplier (USD/MT VLSFO = Brent_USD_per_bbl * factor)

# Voyage charter calculation options
charter_options:
  round_trip: true               # verify: true = ballast return leg included; false = one-way laden voyage

# ==============================================================================
# 5. BALTIC INDEX TO DAILY TIME CHARTER EQUIVALENT (TCE) HIRE MAPPING
#
# IMPORTANT: Baltic sub-indices (BHSI, BSI, BPI, BCI) are quoted in index points, NOT USD/day.
#
# Formula:
#   USD per day = index points * factor
#
# Source & Methodology Notes:
#   - BCI (Capesize): 9.07 USD/day per point (BCI 5TC / BCI index points historical relationship)
#   - BPI (Panamax): 9.00 USD/day per point (BPI 4TC / BPI 82 historical multiplier)
#   - BSI (Supramax): 12.64 USD/day per point (BSI 10TC / BSI historical relationship)
#   - BHSI (Handysize): 18.00 USD/day per point (BHSI 7TC / BHSI 38 historical relationship)
#
# NOTE: These linear conversion factors are an ASSUMPTION for historical data derived
# from typical Baltic Exchange Time Charter average relationships. Because daily spot
# assessments vary with route dynamics and fleet supply, actual historical hire values
# derived with this method are approximate and must be verified against actual SAIL
# charter contract fixtures when internal records become available.
# ==============================================================================
index_to_hire:
  bci:
    vessel_class: "Capesize"
    index_name: "Baltic Capesize Index"
    factor: 9.07                 # ASSUMPTION / verify: USD per day = bci * 9.07
  bpi:
    vessel_class: "Panamax"
    index_name: "Baltic Panamax Index"
    factor: 9.00                 # ASSUMPTION / verify: USD per day = bpi * 9.00
  bsi:
    vessel_class: "Supramax"
    index_name: "Baltic Supramax Index"
    factor: 12.64                # ASSUMPTION / verify: USD per day = bsi * 12.64
  bhsi:
    vessel_class: "Handysize"
    index_name: "Baltic Handysize Index"
    factor: 18.00                # ASSUMPTION / verify: USD per day = bhsi * 18.00
