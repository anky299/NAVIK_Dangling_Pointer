# Maritime Routes, Vessels, Ports, Bunker, and Charter Index Configuration
# SIH26006: Intelligent Freight Forecasting Model for Optimized Vessel Chartering (SAIL / Ministry of Steel)

# ==============================================================================
# 1. VESSEL CLASSES
# ==============================================================================
vessel_classes:
  Handysize:
    dwt: 35000                   # verify: standard Handysize DWT range is 10,000 - 40,000 MT
    parcel_size_mt: 30000        # verify: typical parcel load after draft/stowage allowance
    speed_knots_laden: 12.0      # verify: economical cruising speed laden
    speed_knots_ballast: 12.5    # verify: economical cruising speed ballast
    fuel_consumption_tpd: 18.0   # verify: metric tons VLSFO per day at sea
    fuel_consumption_port_tpd: 2.5 # verify: metric tons VLSFO per day in port
    hire_index: "bhsi"           # Baltic Handysize Index
    max_draft_m: 10.0            # verify: typical fully laden draft

  Supramax:
    dwt: 58000                   # verify: standard Supramax DWT range is 50,000 - 65,000 MT
    parcel_size_mt: 52000        # verify: typical cargo parcel load
    speed_knots_laden: 12.5      # verify: economical cruising speed laden
    speed_knots_ballast: 13.0    # verify: economical cruising speed ballast
    fuel_consumption_tpd: 25.0   # verify: metric tons VLSFO per day at sea
    fuel_consumption_port_tpd: 3.5 # verify: metric tons VLSFO per day in port
    hire_index: "bsi"            # Baltic Supramax Index
    max_draft_m: 12.8            # verify: typical fully laden draft

  Panamax:
    dwt: 75000                   # verify: standard Panamax / Kamsarmax DWT range is 65,000 - 85,000 MT
    parcel_size_mt: 70000        # verify: typical cargo parcel load
    speed_knots_laden: 13.0      # verify: economical cruising speed laden
    speed_knots_ballast: 13.5    # verify: economical cruising speed ballast
    fuel_consumption_tpd: 30.0   # verify: metric tons VLSFO per day at sea
    fuel_consumption_port_tpd: 4.0 # verify: metric tons VLSFO per day in port
    hire_index: "bpi"            # Baltic Panamax Index
    max_draft_m: 14.2            # verify: typical fully laden draft

  Capesize:
    dwt: 170000                  # verify: standard Capesize DWT range is 150,000 - 180,000+ MT
    parcel_size_mt: 155000       # verify: typical bulk coal parcel load
    speed_knots_laden: 13.0      # verify: economical cruising speed laden
    speed_knots_ballast: 13.5    # verify: economical cruising speed ballast
    fuel_consumption_tpd: 48.0   # verify: metric tons VLSFO per day at sea
    fuel_consumption_port_tpd: 5.5 # verify: metric tons VLSFO per day in port
    hire_index: "bci"            # Baltic Capesize Index
    max_draft_m: 18.2            # verify: typical fully laden draft

